<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Ten interactive text effects with live controls. Tweak any effect and download it as ready-to-use HTML, CSS and JS.">
<meta name="theme-color" content="#0b0c0e">
<meta property="og:type" content="website">
<meta property="og:title" content="Text Effect Panel">
<meta property="og:description" content="Ten interactive text effects with live controls. Tweak any effect and download the code.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22#0b0c0e%22/%3E%3Cpath d=%22M8 9h16M16 9v15%22 stroke=%22#ecebe7%22 stroke-width=%223.2%22 stroke-linecap=%22round%22/%3E%3Ccircle cx=%2224%22 cy=%2223%22 r=%222.4%22 fill=%22#d9b56c%22/%3E%3C/svg%3E" type="image/svg+xml">
<title>Text Effect Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Archivo+Black&family=Anton&family=Bebas+Neue&family=Syne:wght@800&family=Unbounded:wght@800&family=DM+Serif+Display&family=Finger+Paint&family=Poppins:wght@900&family=Raleway:wght@400;700&family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&family=Anybody:wdth,wght@50..150,100..900&display=swap">
<style>
/* Layout: slim global bar on top; effects stack as rows that split the remaining height; each row = black stage + control rail on the right */
:root {
  --bg: #0b0c0e;
  --rail: #121316;
  --raise: #1a1c20;
  --line: #26282d;
  --fg: #ecebe7;
  --muted: #878a90;
  --accent: #d9b56c;
  --stage: #000000;
  --ui: "Geist", "Helvetica Neue", Arial, sans-serif;
  --mono: "Geist Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 var(--ui); }
[hidden] { display: none !important; }
* { box-sizing: border-box; }

.app { height: 100%; display: flex; flex-direction: column; gap: 12px; padding-inline: 16px; padding-block: 12px; }

/* global bar */
.bar { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px 18px; }
.brand { display: flex; flex-direction: column; gap: 2px; margin-right: auto; min-width: 0; }
.brand b { font-weight: 600; font-size: 14px; letter-spacing: -0.01em; }
.brand span { font: 11px var(--mono); color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 5px; }
.lbl { font: 500 10px var(--mono); text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); }
.inp, .sel {
  background: var(--raise); color: var(--fg); border: 1px solid var(--line); border-radius: 4px;
  font: 13px var(--ui); height: 30px; padding: 0 9px;
}
.inp { width: 200px; max-width: 100%; }
.sel { padding-right: 4px; }
.inp:focus-visible, .sel:focus-visible, .btn:focus-visible, .seg button:focus-visible, .switch:focus-visible, input[type=range]:focus-visible, .swatch:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px;
}
.field.size { width: 150px; }
.swatch { width: 30px; height: 30px; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: var(--raise); cursor: pointer; }
.swatch::-webkit-color-swatch-wrapper { padding: 3px; }
.swatch::-webkit-color-swatch { border: 0; border-radius: 2px; }
.swatch::-moz-color-swatch { border: 0; border-radius: 2px; }

.btn {
  background: var(--raise); color: var(--fg); border: 1px solid var(--line); border-radius: 4px;
  font: 500 12px var(--ui); height: 30px; padding: 0 11px; cursor: pointer; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
.btn.sm { height: 26px; padding: 0 9px; font-size: 11.5px; }

/* effect stack */
#stack { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; overflow: auto; }
.fx-row {
  flex: 1 1 0; min-height: 340px; position: relative;
  border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--stage);
}
/* open panel claims its own column so it never covers the words */
.fx-row[data-open="true"] .stage { right: 310px; }
.stage-tag {
  position: absolute; left: 12px; top: 10px; font: 11px var(--mono); color: var(--muted);
  letter-spacing: 0.04em; pointer-events: none; display: flex; gap: 8px;
}
.stage-tag em { font-style: normal; color: var(--fg); }
.stage-hint { position: absolute; right: 12px; bottom: 10px; font: 10.5px var(--mono); color: #4a4c52; pointer-events: none; }
/*@region stage*/
.stage { position: absolute; inset: 0; background: var(--stage); cursor: pointer; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.dom-layer { position: absolute; inset: 0; display: grid; place-items: center; overflow: hidden; pointer-events: none; }
.stage-err { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }
/*@endregion*/
/*@region letters*/
.letters { position: relative; white-space: nowrap; line-height: 1; --track: 0em; }
.letters .ch { display: inline-block; margin: 0 calc(var(--track) / 2); will-change: transform, opacity; }
.letters .sp { display: inline-block; width: .28em; }
/*@endregion*/
/*@region spark*/
.spark-line { position: absolute; left: 0; top: 0; bottom: 0; margin: auto 0; width: 0; height: 1.5px; background: currentColor; }
/*@endregion*/
/*@region smoky*/
.smoky .ch { color: transparent; }
/*@endregion*/
/*@region reel*/
.reel .ch { will-change: transform, opacity; }
.reel.v-tuna .ch { transform-origin: 50% 100%; }
.reel.v-bubbling .ch { transform-origin: 50% 85%; }
.reel.v-glitch .ch { position: relative; color: transparent; }
.reel .ga, .reel .gb { position: absolute; inset: 0; color: var(--txt); }
.reel.v-reflective { line-height: .8; }
.reel.v-reflective .ch { letter-spacing: .15ch; }
.reel .rline { display: block; white-space: nowrap; }
.reel .rw { display: inline-block; clip-path: inset(-50% 0 0 0); }
.reel .rline.bot { position: absolute; top: 100%; left: 0; width: 100%; transform: scaleY(-1);
  -webkit-mask-image: linear-gradient(transparent, #000); mask-image: linear-gradient(transparent, #000); }
.reel .rline.bot .rw { clip-path: inset(0 0 -50% 0); }
/*@endregion*/
/*@region gooey*/
.mq-band { position: relative; width: 100%; overflow: hidden; }
.mq-goo { position: absolute; inset: 0; isolation: isolate; }
.mq-goo-in { position: absolute; inset: 0; background-color: #000; }
.mq-walls { position: absolute; inset: -6px; filter: blur(1.5px); }
.mq-tint { position: absolute; inset: 0; mix-blend-mode: multiply; pointer-events: none; }
.mq-clean { position: absolute; inset: 0; }
.mq-track { position: absolute; left: 0; top: 50%; white-space: nowrap; line-height: 1; will-change: transform; }
.mq-goo-in .mq-track { color: #fff; }
.mq-copy { display: inline-block; }
/*@endregion*/
/*@region jello*/
.jello { line-height: 1; }
.jello .ch { pointer-events: auto; cursor: grab; touch-action: none; transform-origin: 50% 100%; user-select: none; -webkit-user-select: none; }
.jello.dragging .ch, .jello.dragging { cursor: grabbing; }
/*@endregion*/
/*@region stroke*/
.draw-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
/*@endregion*/
.seg.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.seg.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.p-langrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.btn.dl-btn {
  position: relative; isolation: isolate; overflow: hidden;
  display: inline-flex; align-items: center; gap: 6px;
  height: 28px; padding: 0 13px; border-radius: 999px;
  color: #fff; font-weight: 600; letter-spacing: .01em;
  background: linear-gradient(180deg, rgba(255,255,255,.20) 0%, rgba(255,255,255,.07) 55%, rgba(255,255,255,.11) 100%);
  border: 1px solid rgba(255,255,255,.24);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.45),
    inset 0 -1px 0 rgba(255,255,255,.08),
    inset 0 -6px 12px rgba(0,0,0,.18),
    0 6px 18px rgba(0,0,0,.40);
  backdrop-filter: blur(14px) saturate(180%); -webkit-backdrop-filter: blur(14px) saturate(180%);
  text-shadow: 0 1px 1px rgba(0,0,0,.35);
  transition: transform .18s cubic-bezier(.3,1.4,.5,1), box-shadow .2s, border-color .2s;
}
/* specular glint that follows the pointer */
.btn.dl-btn::before {
  content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; pointer-events: none;
  background: radial-gradient(90px circle at var(--mx, 30%) var(--my, 0%), rgba(255,255,255,.42), rgba(255,255,255,0) 60%);
  opacity: .55; transition: opacity .2s;
}
/* glossy top lip */
.btn.dl-btn::after {
  content: ""; position: absolute; left: 6px; right: 6px; top: 1px; height: 45%; z-index: -1; pointer-events: none;
  border-radius: 999px 999px 60% 60% / 999px 999px 100% 100%;
  background: linear-gradient(180deg, rgba(255,255,255,.34), rgba(255,255,255,0));
}
.btn.dl-btn:hover {
  border-color: rgba(255,255,255,.40); transform: translateY(-1px);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.55),
    inset 0 -1px 0 rgba(255,255,255,.10),
    inset 0 -6px 12px rgba(0,0,0,.16),
    0 10px 24px rgba(0,0,0,.45),
    0 0 0 4px rgba(255,255,255,.05);
}
.btn.dl-btn:hover::before { opacity: 1; }
.btn.dl-btn:active { transform: translateY(0) scale(.96); }
.btn.dl-btn:focus-visible { outline: 2px solid rgba(255,255,255,.8); outline-offset: 2px; }
.btn.dl-btn:disabled { opacity: .6; cursor: progress; transform: none; }
.dl-btn svg { width: 12px; height: 12px; flex: none; filter: drop-shadow(0 1px 1px rgba(0,0,0,.35)); }
.dl-status { font-size: 11px; color: var(--muted); }

/* control dropdown, floating over the stage's top-right corner */
.panel {
  position: absolute; top: 10px; right: 10px; width: 290px; max-width: calc(100% - 20px); max-height: calc(100% - 20px);
  display: flex; flex-direction: column; min-width: 0;
  background: color-mix(in srgb, var(--rail) 92%, transparent); border: 1px solid var(--line); border-radius: 6px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .45); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.p-toggle {
  display: flex; align-items: center; gap: 8px; width: 100%; background: transparent; border: 0; color: var(--fg);
  padding: 9px 12px; cursor: pointer; text-align: left; font: 600 13px var(--ui); border-radius: 6px;
}
.p-toggle:hover .chev { color: var(--fg); }
.p-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.p-toggle .sub { font: 500 10px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.09em; margin-left: auto; }
.chev { width: 12px; height: 12px; color: var(--muted); transition: transform .18s; flex: none; }
.panel[data-open="false"] .chev { transform: rotate(-90deg); }
.panel[data-open="true"] .p-toggle { border-bottom: 1px solid var(--line); border-radius: 6px 6px 0 0; }
.p-body { overflow-y: auto; padding: 12px 12px 16px; display: flex; flex-direction: column; gap: 16px; min-height: 0; }
.p-head { display: flex; flex-direction: column; gap: 10px; }
.p-text { width: 100%; }
.p-note { font-size: 11px; color: var(--muted); }
.link-btn { background: none; border: 0; padding: 0; color: var(--accent); font: 500 11px var(--ui); cursor: pointer; }
.link-btn:hover { text-decoration: underline; }
.link-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.p-langs { display: flex; flex-wrap: wrap; gap: 5px; }
.p-lang { font: 500 10.5px var(--mono); letter-spacing: .06em; color: var(--fg); background: var(--raise); border: 1px solid var(--line); border-radius: 3px; padding: 2px 6px; }
.p-actions { display: flex; flex-wrap: wrap; gap: 6px; }

.timeline { display: flex; flex-direction: column; gap: 4px; }
.timeline .ctl-head { font: 11px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }

.group { display: block; }
.group-body { display: flex; flex-direction: column; gap: 12px; padding-top: 12px; }
.group > summary.lbl { padding-bottom: 6px; border-bottom: 1px solid var(--line); cursor: pointer; list-style: none; display: flex; justify-content: space-between; }
.group > summary.lbl::-webkit-details-marker { display: none; }
.group > summary.lbl::after { content: "−"; color: var(--muted); }
.group:not([open]) > summary.lbl::after { content: "+"; }
.group > summary.lbl:hover { color: var(--fg); }
.group > summary.lbl:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ctl { display: flex; flex-direction: column; gap: 5px; }
.ctl-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.ctl-head label, .ctl-head .name { font-size: 12px; color: var(--fg); }
.ctl-head output { font: 11.5px var(--mono); color: var(--accent); font-variant-numeric: tabular-nums; }

.seg { display: flex; background: var(--raise); border: 1px solid var(--line); border-radius: 4px; padding: 2px; gap: 2px; }
.seg button {
  flex: 1; min-width: 0; background: transparent; border: 0; border-radius: 3px; color: var(--muted);
  font: 500 11.5px var(--ui); height: 24px; cursor: pointer; padding: 0 4px; white-space: nowrap;
}
.seg button:hover { color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--line); color: var(--fg); }

.switch-row { display: flex; justify-content: space-between; align-items: center; }
.switch { width: 34px; height: 18px; border-radius: 9px; background: var(--line); border: 0; position: relative; cursor: pointer; padding: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s; }
.switch[aria-checked="true"] { background: #4a3f27; }
.switch[aria-checked="true"]::after { transform: translateX(16px); background: var(--accent); }

input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 16px; background: transparent; margin: 0; cursor: pointer; --pct: 50%; }
input[type=range]::-webkit-slider-runnable-track { height: 2px; border-radius: 1px; background: linear-gradient(to right, var(--accent) var(--pct), var(--line) var(--pct)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--fg); margin-top: -5px; border: 0; }
input[type=range]::-moz-range-track { height: 2px; background: var(--line); border-radius: 1px; }
input[type=range]::-moz-range-progress { height: 2px; background: var(--accent); border-radius: 1px; }
input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--fg); border: 0; }
.timeline input[type=range]::-webkit-slider-runnable-track { background: linear-gradient(to right, var(--fg) var(--pct), var(--line) var(--pct)); }
.timeline input[type=range]::-moz-range-progress { background: var(--fg); }

.copy-out { width: 100%; min-height: 120px; background: var(--raise); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; font: 11px/1.45 var(--mono); padding: 8px; resize: vertical; }

@media (max-width: 760px) {
  .app { height: auto; min-height: 100%; }
  #stack { overflow: visible; }
  .fx-row { min-height: 0; display: flex; flex-direction: column; background: var(--rail); }
  .stage, .fx-row[data-open="true"] .stage { position: relative; inset: auto; height: min(62vw, 360px); min-height: 220px; }
  .panel { position: static; width: auto; max-width: none; max-height: none; border: 0; border-top: 1px solid var(--line); border-radius: 0; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; background: var(--rail); }
  .p-body { overflow: visible; }
  .inp { width: 100%; }
  .field.text { flex: 1 1 100%; }
  .brand { flex: 1 1 100%; }
}
@media (prefers-reduced-motion: reduce) { .switch::after, .chev, .btn.dl-btn { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand"><b>Text Effect Panel</b><span id="fxCount">10 effects</span></div>
    <div class="field text"><label class="lbl" for="gText">Text</label><input id="gText" class="inp" type="text" value="Let Him Cook" spellcheck="false"></div>
    <div class="field"><label class="lbl" for="gFont">Font</label><select id="gFont" class="sel"></select></div>
    <div class="field size">
      <div class="ctl-head"><label class="lbl" for="gSize">Size</label><output id="gSizeOut" class="lbl" style="color:var(--accent)">24%</output></div>
      <input id="gSize" type="range" min="0.08" max="0.6" step="0.01" value="0.24">
    </div>
    <div class="field"><label class="lbl" for="gColor">Color</label><input id="gColor" class="swatch" type="color" value="#ffffff"></div>
    <div class="field"><span class="lbl">&nbsp;</span><button id="replayAll" class="btn" type="button">Replay all</button></div>
  </header>
  <main id="stack"></main>
</div>

<script>
(() => {
'use strict';
const SRC = document.currentScript ? document.currentScript.textContent : '';

//@region core
/* ---------- global text settings ---------- */
const FONTS = {
  'Archivo Black':   { gf: 'Archivo+Black', weight: 400, stack: '"Archivo Black", "Arial Black", sans-serif' },
  'Anton':           { gf: 'Anton', weight: 400, stack: '"Anton", Impact, sans-serif' },
  'Bebas Neue':      { gf: 'Bebas+Neue', weight: 400, stack: '"Bebas Neue", Impact, sans-serif' },
  'Syne':            { gf: 'Syne:wght@800', weight: 800, stack: '"Syne", "Arial Black", sans-serif' },
  'Unbounded':       { gf: 'Unbounded:wght@800', weight: 800, stack: '"Unbounded", "Arial Black", sans-serif' },
  'DM Serif Display':{ gf: 'DM+Serif+Display', weight: 400, stack: '"DM Serif Display", Georgia, serif' },
  'Finger Paint':    { gf: 'Finger+Paint', weight: 400, stack: '"Finger Paint", "Comic Sans MS", cursive' },
  'Raleway':         { gf: 'Raleway:wght@400;700', weight: 400, stack: '"Raleway", "Helvetica Neue", Arial, sans-serif' },
  'Poppins Black':   { gf: 'Poppins:wght@900', weight: 900, stack: '"Poppins", "Arial Black", sans-serif', family: 'Poppins' },
  'Helvetica / Arial':{ weight: 700, stack: '"Helvetica Neue", Helvetica, Arial, sans-serif', system: true }
};
const G = { text: 'Let Him Cook', font: 'Archivo Black', size: 0.24, color: '#ffffff' };
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const DPR = Math.min(window.devicePixelRatio || 1, 2);
const clamp01 = v => Math.max(0, Math.min(1, v));
const hexToRgb = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; };

/* each effect can override the shared text; empty = follow the top bar */
const textOf = row => (row && row.text) ? row.text : G.text;

/* ---------- shared GL bits ---------- */
const VERT = `#version 300 es
in vec2 pos;
void main(){ gl_Position = vec4(pos, 0., 1.); }`;

//@endregion
//@region pixel-scan
/* =========================================================
   EFFECT 01 — Pixel Scan
   Port of fand's "Pixel Scan effect with VFX-JS" shader
   (codepen.io/fand/pen/MWMBdbj), driven by our own clock.
   ========================================================= */
const PIXEL_SCAN_FRAG = `#version 300 es
precision highp float;
uniform sampler2D src;
uniform vec2 resolution;   // effect frame size (px)
uniform vec2 offset;       // effect frame origin (px, GL coords)
uniform vec2 canvasSize;   // full canvas size (px)
uniform float prog;
uniform float dirU;
uniform int mode;
uniform float layers;
uniform float width;
uniform float pixelSize;
uniform float intensity;
uniform float edgeGlow;
uniform float hueShift;
uniform float saturation;
uniform int colorMode;
uniform vec3 tint;
out vec4 outColor;

#define W width
float dir = 1.;

vec2 toTex(vec2 uv){ return (offset + uv * resolution) / canvasSize; }
vec4 readTex(vec2 uv){
  if (uv.x < 0. || uv.x > 1. || uv.y < 0. || uv.y > 1.) return vec4(0);
  return texture(src, toTex(uv));
}
float hash(vec2 p){ return fract(sin(dot(p, vec2(4859., 3985.))) * 3984.); }
vec3 hsv2rgb(vec3 c){
  vec4 K = vec4(1., 2./3., 1./3., 3.);
  vec3 p = abs(fract(c.xxx + K.xyz) * 6. - K.www);
  return c.z * mix(K.xxx, clamp(p - K.xxx, 0., 1.), c.y);
}
float sdBox(vec2 p, float r){ vec2 q = abs(p) - r; return min(length(q), max(q.y, q.x)); }

float toRangeT(vec2 p, float scale){
  float d;
  if (mode == 0)      d = p.x / (scale * 2.) + .5;          // left to right
  else if (mode == 1) d = 1. - (p.y / (scale * 2.) + .5);   // top to bottom
  else                d = length(p) / scale;                // radial
  return dir > 0. ? d : 1. - d;
}

vec4 cell(vec2 p, vec2 pi, float scale, float t, float edge){
  vec2 pc = pi + .5;
  vec2 uvc = pc / scale;
  uvc.y /= resolution.y / resolution.x;
  uvc = uvc * .5 + .5;
  if (uvc.x < 0. || uvc.x > 1. || uvc.y < 0. || uvc.y > 1.) return vec4(0);
  float alpha = smoothstep(0., .1, texture(src, toTex(uvc), 3.).a);

  vec3 col = colorMode == 0
    ? hsv2rgb(vec3((pc.x * 13. / pc.y * 17.) * .3 + hueShift, saturation, 1.))
    : tint * (.55 + .45 * hash(pi + 7.3));
  vec4 color = vec4(col, 1.);

  float x = toRangeT(pi, scale);
  float n = hash(pi);
  float anim = 1. - smoothstep(0., W * 2., abs(x + n * W - t));
  color *= anim;

  float k = edge * edgeGlow * pow(anim, 10.);
  color *= max(mix(1., clamp(.3 / abs(sdBox(p - pc, .5)), 0., 10.), k), 0.);
  return color * alpha;
}

vec4 cellsColor(vec2 p, float scale, float t){
  vec2 pi = floor(p);

  cc += cell(p, pi, scale, t, .2) * 4.;

  cc += cell(p, pi - d.xy, scale, t, .9);
  cc += cell(p, pi + d.yx, scale, t, .9);
  cc += cell(p, pi - d.yx, scale, t, .9);
  return cc / 8.;
}

  float x = toRangeT(pi, scale);
  c *= 1. - smoothstep(t - W, t, x + n * W);

const cssEase = (() => { // CSS "ease" = cubic-bezier(.25,.1,.25,1)
  const x1 = .25, y1 = .1, x2 = .25, y2 = 1;
  const bx = t => 3 * x1 * (1 - t) * (1 - t) * t + 3 * x2 * (1 - t) * t * t + t * t * t;
  const by = t => 3 * y1 * (1 - t) * (1 - t) * t + 3 * y2 * (1 - t) * t * t + t * t * t;
  const dbx = t => 3 * x1 * (1 - t) * (1 - t) + 6 * (x2 - x1) * (1 - t) * t + 3 * (1 - x2) * t * t;
  return x => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 8; i++) { const d = dbx(t); if (Math.abs(d) < 1e-6) break; t = Math.min(1, Math.max(0, t - (bx(t) - x) / d)); }
    return by(t);
  };
})();

  const layer = el('div', 'dom-layer');
  const wrap = el('div', 'letters ' + variant);
  layer.append(wrap);
  row.stage.insertBefore(layer, row.tag);
  row.fx = Object.assign({ layer, wrap, letters: [], rand: [], k: [], fontSize: 16 }, extra || {});
}
function layoutLetters(row) {
  const fx = row.fx; if (!fx) return false;
  const f = FONTS[G.font], p = row.p;
  const text = p.upper ? textOf(row).toUpperCase() : textOf(row);
  fx.wrap.textContent = '';

    if (/\s/.test(ch)) { fx.wrap.append(el('span', 'sp')); continue; }
    const sp = el('span', 'ch', ch); fx.wrap.append(sp); letters.push({ el: sp });
  }
  if (fx.line) fx.wrap.append(fx.line);
  Object.assign(fx.wrap.style, { fontFamily: f.stack, fontWeight: String(f.weight), color: G.color });
  fx.wrap.style.setProperty('--track', (p.track || 0) + 'em');

/* =========================================================
   EFFECT 05 — Entrance Reel
   Tuna Drop: Creative Ocean's GSAP CustomBounce pen (codepen.io/creativeocean/pen/GRMrQpq).

   Every keyframe is evaluated per frame from the clock so all six scrub.

const cubicBezier = (x1, y1, x2, y2) => {
  const bx = t => 3 * x1 * (1 - t) * (1 - t) * t + 3 * x2 * (1 - t) * t * t + t * t * t;
  const by = t => 3 * y1 * (1 - t) * (1 - t) * t + 3 * y2 * (1 - t) * t * t + t * t * t;
  const dbx = t => 3 * x1 * (1 - t) * (1 - t) + 6 * (x2 - x1) * (1 - t) * t + 3 * (1 - x2) * t * t;
  return x => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 10; i++) { const d = dbx(t); if (Math.abs(d) < 1e-6) break; t = Math.min(1, Math.max(0, t - (bx(t) - x) / d)); }
    return by(t);

function keyframes(keys, u, ease) {
  if (u <= keys[0][0]) return keys[0].slice(1);
  for (let i = 1; i < keys.length; i++) {
    const a = keys[i - 1], b = keys[i];
    if (u <= b[0]) {
      const t = ease((u - a[0]) / Math.max(1e-6, b[0] - a[0]));
      return a.slice(1).map((v, j) => v + (b[j + 1] - v) * t);
    }
  }
  return keys[keys.length - 1].slice(1);
}

/* CustomBounce stand-in: a ball dropped from 1 bounces with restitution `e`;

  e = Math.max(0, Math.min(0.92, e));
  const segs = []; let total = 1;
  for (let k = 1; k < 14; k++) { const h = Math.pow(e, 2 * k); if (h < 0.0015) break; const d = 2 * Math.pow(e, k); segs.push({ h, d }); total += d; }
  const impacts = [{ t: 1 / total, a: 1 }];
  let acc = 1;
  segs.forEach((sg, k) => { acc += sg.d; impacts.push({ t: acc / total, a: Math.pow(e, k + 1) }); });
  impacts.pop();
  const w = 0.045;
  const fn = {
    y(u) {
      let t = clamp01(u) * total;
      if (t < 1) return t * t;
      t -= 1;
      for (const sg of segs) { if (t < sg.d) { const x = (t - sg.d / 2) / (sg.d / 2); return 1 - sg.h * (1 - x * x); } t -= sg.d; }
      return 1;
    },
    squash(u) {
      for (const im of impacts) if (u >= im.t && u < im.t + w) return im.a * Math.sin(Math.PI * (u - im.t) / w);
      return 0;
    }
  };
  return (bounceCache[key] = fn);
}

const REEL = [['Tuna Drop', 'tuna'], ['Cascade', 'cascade'], ['Swapsies', 'swapsies'], ['Glitch', 'glitch'], ['Reflective', 'reflective'], ['Bubbling', 'bubbling']];
const GLITCH_KEYS = [[0, 20, 20, -4], [.05, 30, 20, -4], [.1, 80, 10, -4], [.15, 55, 10, -4], [.2, 0, 0, 0], [.5, 0, 0, 0], [1, 0, 0, 0]];
const CASCADE_POS = [[0, -300, -300], [.1, -200, -300], [.3, -200, -200], [.5, -100, -200], [.7, -100, -100], [.9, 0, -100], [1, 0, 0]];
const CASCADE_OP = [[0, 0], [.5, 1], [1, 1]];
const BUBBLE_ORDER = [3, 2, 5, 8, 7, 6, 1, 4];
const SPEED = 0.5, STEP = 0.05; // jh3y's --transition-speed / --transition-step, scaled by the multipliers

const EntranceReel = {
  id: 'entrance-reel',
  name: 'Entrance Reel',
  langs: ['JS', 'CSS'],
  kind: 'dom',
  groups: [
    { label: 'Playback', controls: [
      { key: 'trigger', label: 'Trigger', type: 'segment', options: [['Auto cycle', 'loop'], ['Hover', 'hover'], ['Click', 'click']], def: 'loop' },
      { key: 'variant', label: 'Entrance', type: 'segment', grid: true, options: REEL, def: 'tuna' },
      { key: 'hold', label: 'Hold between', type: 'range', min: 0, max: 4, step: 0.1, def: 1.2, unit: 's' },
      { key: 'durMul', label: 'Duration', type: 'range', min: 0.25, max: 3, step: 0.05, def: 1, unit: '×' },
      { key: 'stagMul', label: 'Stagger', type: 'range', min: 0, max: 3, step: 0.05, def: 1, unit: '×' }
    ]},
    { label: 'Tuna Drop', show: p => p.variant === 'tuna', controls: [
      { key: 'dropH', label: 'Drop height', type: 'range', min: 0.5, max: 6, step: 0.1, def: 2.7, unit: 'em' },
      { key: 'bounce', label: 'Bounciness', type: 'range', min: 0, max: 0.9, step: 0.01, def: 0.6 },
      { key: 'squash', label: 'Squash', type: 'range', min: 0, max: 2, step: 0.05, def: 1, unit: '×' },
      { key: 'tilt', label: 'Tilt', type: 'range', min: 0, max: 45, step: 1, def: 15, unit: '°' }
    ]},
    { label: 'Glitch', show: p => p.variant === 'glitch', controls: [
      { key: 'glitchAmt', label: 'Slice shift', type: 'range', min: 0, max: 4, step: 0.05, def: 1, unit: '×' }
    ]},
    { label: 'Reflective', show: p => p.variant === 'reflective', controls: [
      { key: 'reflAlpha', label: 'Reflection', type: 'range', min: 0, max: 1, step: 0.01, def: 1 }
    ]},
    { label: 'Bubbling', show: p => p.variant === 'bubbling', controls: [
      { key: 'bubbleFrom', label: 'Start scale', type: 'range', min: 0, max: 1, step: 0.01, def: 0.35, unit: '×' }
    ]},
    { label: 'Type', controls: [
      { key: 'upper', label: 'Uppercase', type: 'toggle', def: false },
      { key: 'track', label: 'Letter spacing', type: 'range', min: 0, max: 1.5, step: 0.01, def: 0, unit: 'em' }
    ]}
  ],
  duration(p, row) {
    const n = row && row.fx ? Math.max(1, row.fx.letters.length) : 12, D = p.durMul, St = p.stagMul;
    switch (p.variant) {
      case 'tuna': return 0.1 * St + 1.5 * D;
      case 'cascade': return n * STEP * St + SPEED * 4 * D;
      case 'swapsies': return (n - 1) * STEP * St + 0.5 * D;
      case 'glitch': return (n - 1) * 0.1 * St + 2 * D;
      case 'reflective': return 0.5 * D + ((row && row.fx ? row.fx.maxWord : 8) - 1) * 1.25 * STEP * St + SPEED * 1.25 * D;
      default: return SPEED * D + 8 * STEP * St + SPEED * D;
    }
  },
  total(p, row) { return this.duration(p, row) + (p.trigger === 'loop' ? p.hold : 0); },
  restFrame() { return 1e3; },
  describe(p) { return (REEL.find(r => r[1] === p.variant) || REEL[0])[0]; },

  setup(row) {
    const layer = el('div', 'dom-layer');
    const wrap = el('div', 'letters reel');
    layer.append(wrap);
    row.stage.insertBefore(layer, row.tag);
    row.fx = { layer, wrap, letters: [], rot: [], fontSize: 16, maxWord: 1 };
  },
  layout(row) {
    const fx = row.fx; if (!fx) return;
    const f = FONTS[G.font], p = row.p, v = p.variant;
    const text = p.upper ? textOf(row).toUpperCase() : textOf(row);
    const wrap = fx.wrap;
    wrap.className = 'letters reel v-' + v;
    wrap.textContent = '';
    const letters = [];
    const words = text.split(/(\s+)/).filter(x => x.length);
    fx.maxWord = 1;
    const buildLine = (cls, copy) => {
      const line = v === 'reflective' ? el('div', 'rline ' + cls) : wrap;
      let li = 0;
      words.forEach(w => {
        if (/^\s+$/.test(w)) { line.append(el('span', 'sp')); return; }
        const holder = v === 'reflective' ? el('span', 'rw') : line;
        Array.from(w).forEach((ch, wi) => {
          const c = el('span', 'ch', ch);
          if (v === 'glitch') { c.append(el('span', 'ga', ch), el('span', 'gb', ch)); }
          holder.append(c);
          if (copy === 0) letters.push({ els: [c], w: wi, ga: c.children[0], gb: c.children[1] });
          else letters[li].els.push(c);
          li++;
          fx.maxWord = Math.max(fx.maxWord, wi + 1);
        });
        if (holder !== line) line.append(holder);
      });
      if (line !== wrap) wrap.append(line);
      return line;
    };
    buildLine('top', 0);
    if (v === 'reflective') fx.bot = buildLine('bot', 1); else fx.bot = null;
    Object.assign(wrap.style, { fontFamily: f.stack, fontWeight: String(f.weight), color: G.color });
    wrap.style.setProperty('--txt', G.color);
    wrap.style.setProperty('--track', (p.track || 0) + 'em');
    const W = row.stage.clientWidth, H = row.stage.clientHeight;
    let fs = H * G.size;
    wrap.style.fontSize = fs + 'px';
    const w = wrap.offsetWidth;
    if (w > W * 0.9 && w > 0) { fs *= (W * 0.9) / w; wrap.style.fontSize = fs + 'px'; }
    fx.fontSize = fs;
    fx.letters = letters;
    if (fx.rot.length !== letters.length) this.onRestart(row);
    this.render(row, row.clock);
  },
  onRestart(row) { if (row.fx) row.fx.rot = row.fx.letters.map(() => Math.random() * 2 - 1); },
  onParam(row, key) {
    if (!row.fx) return;
    if (!key || key === 'variant' || key === 'upper' || key === 'track') this.layout(row);
    if (key === 'variant') row.replay();
  },
  onCycle(row) {
    const i = REEL.findIndex(r => r[1] === row.p.variant);
    row.p.variant = REEL[(i + 1) % REEL.length][1];
    row.ctrl.variant(row.p.variant);
    row.onParam('variant');
  },
  hitRect(row) { return lettersHitRect(row); },

  render(row, c) {
    const fx = row.fx, p = row.p, n = fx.letters.length, fs = fx.fontSize;
    const D = p.durMul, St = p.stagMul;
    const set = (L, tf, op) => L.els.forEach(e => { e.style.transform = tf; e.style.opacity = op; });
    if (fx.bot) fx.bot.style.opacity = String(p.reflAlpha);
    fx.letters.forEach((L, i) => {
      switch (p.variant) {
        case 'tuna': {
          const B = makeBounce(p.bounce);
          const d = 0.1 * St * sineIn(n > 1 ? i / (n - 1) : 0);
          const tau = c - d, u = clamp01(tau / (1.5 * D));
          const op = power1InOut(clamp01(tau / (0.6 * D)));
          const y = -p.dropH * fs * (1 - B.y(u));
          const sq = B.squash(u) * p.squash;
          const rot = (fx.rot[i] || 0) * p.tilt * B.squash(u);
          set(L, `translateY(${y}px) rotate(${rot}deg) scale(${1 + 0.8 * sq}, ${1 - 0.3 * sq})`, String(op));
          break;
        }
        case 'cascade': {
          const d = (n - i) * STEP * St, u = clamp01((c - d) / (SPEED * 4 * D));
          const [x, y] = keyframes(CASCADE_POS, u, cssEase);
          const [op] = keyframes(CASCADE_OP, u, cssEase);
          set(L, `translate(${x}%, ${y}%)`, String(op));
          break;
        }
        case 'swapsies': {
          const t = i % 2 === 0 ? 100 : -100;
          const u = clamp01((c - i * STEP * St) / (0.5 * D));
          const [x, y] = keyframes([[0, t, 0], [.25, t, t], [.75, 0, t], [1, 0, 0]], u, cssEase);
          set(L, `translate(${x}%, ${y}%)`, '1');
          break;
        }
        case 'glitch': {
          const T = D, tau = c - i * 0.1 * St;
          let split = 0, shift = 0, sh = 0;
          if (tau >= 0 && tau < 2 * T) {
            const q = tau < T ? 1 - tau / T : (tau - T) / T;   // 2 iterations, alternate-reverse
            [split, shift, sh] = keyframes(GLITCH_KEYS, q, easeInOut);
          }
          set(L, '', '1');
          if (L.ga) {
            const k = fs / 56;
            L.ga.style.clipPath = `inset(${95 - split}% 0 0 0)`;
            L.gb.style.clipPath = `inset(0 0 ${split}% 0)`;
            L.gb.style.transform = `translateX(${shift * p.glitchAmt}%)`;
            L.gb.style.textShadow = sh ? `${sh * k}px ${sh * k}px #000` : 'none';
          }
          break;
        }
        case 'reflective': {
          const d = 0.5 * D + L.w * 1.25 * STEP * St;
          const u = clamp01((c - d) / (SPEED * 1.25 * D));
          set(L, `translateY(${110 * (1 - reflectJump(u))}%)`, '1');
          break;
        }
        default: { // bubbling
          const d = SPEED * D + BUBBLE_ORDER[i % 8] * STEP * St;
          const u = clamp01((c - d) / (SPEED * D));
          const sc = p.bubbleFrom + (1 - p.bubbleFrom) * elastic5(u);
          set(L, `scale(${sc})`, '1');
        }
      }
    });
  }
};

//@region erode
/* =========================================================
   EFFECT 06 — Erode
   Port of fand's VFX-JS erode shader (codepen.io/fand/pen/xbKBYqz):
   fbm noise plus a travelling sine wave thresholds the text away,
   with a glowing ember line where the noise crosses the edge.
   ========================================================= */
const ERODE_FRAG = `#version 300 es
precision highp float;
uniform sampler2D src;
uniform vec2 resolution;
uniform vec2 offset;
uniform vec2 canvasSize;
uniform float phase;
uniform float boost;
uniform float scale;
uniform float spread;
uniform float glowW;
uniform float glowAmt;
uniform float drift;
uniform float time;
uniform int dirMode;
uniform vec3 glowColor;
out vec4 outColor;

vec2 toTex(vec2 uv){ return (offset + uv * resolution) / canvasSize; }
vec4 readTex(vec2 uv){
  if (uv.x < 0. || uv.x > 1. || uv.y < 0. || uv.y > 1.) return vec4(0);
  return texture(src, toTex(uv));
}
float rand2(vec2 p){ return fract(sin(dot(p, vec2(111., 123.))) * 3000.); }
float noise(vec2 p){
  vec2 pi = floor(p);
  vec2 pf = fract(p);
  pf = smoothstep(0., 1., pf);
  vec2 d = vec2(1, 0);
  return mix(mix(rand2(pi), rand2(pi + d.xy), pf.x), mix(rand2(pi + d.yx), rand2(pi + d.xx), pf.x), pf.y);
}
float fbm(vec2 p){
  float v = 0.;
  v += noise(p) * 0.5;
  v += noise(p * 1.7 + .3) * 0.3;
  v += noise(p * 2.3 + .9) * 0.2;
  v += noise(p * 3.1 + 3.9) * 0.1;
  v += noise(p * 8.9 + 10.9) * 0.07;
  v += noise(p * 14.9 - 1.9) * 0.03;
  return v;
}

/* 0..1 order in which each point burns (0 = first) */
float wipeOrder(vec2 uv){
  if (dirMode == 0) return uv.x;                                   // left to right
  if (dirMode == 1) return 1. - uv.x;                              // right to left
  if (dirMode == 2) return 1. - uv.y;                              // top down
  if (dirMode == 3) return uv.y;                                   // bottom up
  if (dirMode == 4) return length((uv - .5) * 2.) / 1.41421;       // center out (oval fitted to the words)
  if (dirMode == 5) return 1. - length((uv - .5) * 2.) / 1.41421;  // edges in
  if (dirMode == 6) return abs(uv.x - .5) * 2.;                    // split from the middle, sideways
  if (dirMode == 7) return abs(uv.y - .5) * 2.;                    // split from the middle, up and down
  return (uv.x + 1. - uv.y) * .5;                                  // diagonal, top-left first
}

void main(){
  vec2 uv = (gl_FragCoord.xy - offset) / resolution;
  vec2 p = uv * 2. - 1.;
  p.x *= resolution.x / resolution.y;

  vec4 c = readTex(uv);
  float n = fbm(p * scale + vec2(time * drift, 0.));

  float d = wipeOrder(uv);
  n += sin(phase - d * spread) + boost;

  float s = glowW / abs(n - .5);
  s *= c.a;
  c *= smoothstep(0., .02, n - .52);
  c += s * glowAmt * vec4(glowColor, 1.);
  outColor = vec4(c.rgb, 1.);
}`;

const Erode = {
  id: 'erode',
  name: 'Erode',
  langs: ['JS', 'GLSL'],
  frag: ERODE_FRAG,
  hoverHold: true, // hover burns the words away; leaving grows them back
  groups: [
    { label: 'Motion', controls: [
      { key: 'trigger', label: 'Trigger', type: 'segment', options: [['Hover', 'hover'], ['Click', 'click'], ['Auto loop', 'loop']], def: 'loop' },
      { key: 'dir', label: 'Wipe', type: 'segment', grid: 3, options: [['Center out', 4], ['Edges in', 5], ['Split ↔', 6], ['Split ↕', 7], ['Diagonal', 8], ['L → R', 0], ['R → L', 1], ['Top ↓', 2], ['Bottom ↑', 3]], def: 4 },
      { key: 'period', label: 'Cycle time', type: 'range', min: 1, max: 20, step: 0.1, def: 6.3, unit: 's' },
      { key: 'hold', label: 'Hold burnt (click / loop)', type: 'range', min: 0, max: 4, step: 0.1, def: 0, unit: 's' }
    ]},
    { label: 'Erosion', controls: [
      { key: 'scale', label: 'Noise scale', type: 'range', min: 0.5, max: 8, step: 0.05, def: 2 },
      { key: 'spread', label: 'Front spread', type: 'range', min: 0, max: 6, step: 0.05, def: 2 },
      { key: 'drift', label: 'Noise drift', type: 'range', min: 0, max: 1, step: 0.01, def: 0 },
      { key: 'pad', label: 'Frame padding', type: 'range', min: 0, max: 1.5, step: 0.05, def: 0.4, unit: '×' }
    ]},
    { label: 'Ember', controls: [
      { key: 'glowColor', label: 'Ember color', type: 'color', def: '#ff4d00' },
      { key: 'glowW', label: 'Edge width', type: 'range', min: 0, max: 0.12, step: 0.002, def: 0.03 },
      { key: 'glowAmt', label: 'Intensity', type: 'range', min: 0, max: 3, step: 0.05, def: 1 }
    ]}
  ],
  uniforms: ['resolution', 'offset', 'canvasSize', 'phase', 'boost', 'scale', 'spread', 'glowW', 'glowAmt', 'drift', 'time', 'dirMode', 'glowColor'],
  total(p) { return p.period + p.hold; },
  restFrame() { return 0; },
  holdAt(p) { return p.period / 2; },
  releaseAt(p) { return p.period / 2 + p.hold; },
  captureRelease(row) { row.releaseFrom = row.lastF != null ? Math.min(0.5, row.lastF) : 0.5; },
  stateAt(p, c, row) {
    // f = position in one burn cycle: 0 intact, .5 burnt away, 1 intact again
    const Cy = p.period, half = Cy / 2, rel = half + p.hold;
    let f;
    if (c < half) f = c / Cy;
    else if (c < rel) f = 0.5;
    else {
      const from = row && typeof row.releaseFrom === 'number' ? row.releaseFrom : 0.5;
      f = from + (1 - from) * clamp01((c - rel) / Math.max(1e-3, (1 - from) * Cy));
    }
    if (row) row.lastF = f;
    const cs = Math.cos(2 * Math.PI * f);
    return {
      phase: Math.PI / 2 + p.spread / 2 + 2 * Math.PI * f,
      boost: 1.2 * Math.sign(cs) * Math.pow(Math.abs(cs), 6), // clean start/end, fully burnt at the midpoint
      time: performance.now() / 1000
    };
  },
  apply(gl, u, p, s, w, h, box) {
    const pad = p.pad * (box.y1 - box.y0);
    const x0 = box.x0 - pad, x1 = box.x1 + pad, y0 = box.y0 - pad, y1 = box.y1 + pad;
    gl.uniform2f(u.resolution, Math.max(1, x1 - x0), Math.max(1, y1 - y0));
    gl.uniform2f(u.offset, x0, h - y1);
    gl.uniform2f(u.canvasSize, w, h);
    gl.uniform1f(u.phase, s.phase);
    gl.uniform1f(u.boost, s.boost);
    gl.uniform1f(u.scale, p.scale);
    gl.uniform1f(u.spread, p.spread);
    gl.uniform1f(u.glowW, p.glowW);
    gl.uniform1f(u.glowAmt, p.glowAmt);
    gl.uniform1f(u.drift, p.drift);
    gl.uniform1f(u.time, s.time);
    gl.uniform1i(u.dirMode, p.dir);
    gl.uniform3fv(u.glowColor, hexToRgb(p.glowColor));
  },
  describe(p) { return ['Burn left → right', 'Burn right → left', 'Burn top down', 'Burn bottom up', 'Burn center out', 'Burn edges in', 'Split sideways', 'Split up and down', 'Burn diagonal'][p.dir]; }
};

//@region stroke
/* =========================================================
   EFFECT 07 — Stroke Draw
   After l3dlp's "GSAP DrawSVG Stroke Animation" (codepen.io/l3dlp/pen/yLZazzb).
   The pen draws hand-made SVG paths; here each letter's outline is traced from
   the live font (marching squares), then drawn with the same layered trail:
   five thin colored strokes chase each other and the final stroke lands on top.
   ========================================================= */
const TRACE_PX = 240;
const glyphCache = new Map();

function traceGlyph(ch, font) {
  const f = FONTS[font], fam = f.family || font;
  const loaded = f.system || !document.fonts || document.fonts.check(`${f.weight} 40px "${fam}"`);
  const key = `${font}|${loaded ? 1 : 0}|${ch}`;
  if (glyphCache.has(key)) return glyphCache.get(key);

  const S = TRACE_PX, pad = Math.ceil(S * 0.35);
  const cv = document.createElement('canvas');
  const cx = cv.getContext('2d', { willReadFrequently: true });
  cx.font = `${f.weight} ${S}px ${f.stack}`;
  const adv = cx.measureText(ch).width;
  const W = Math.ceil(adv + pad * 2), H = Math.ceil(S * 1.3 + pad * 2), base = pad + S;
  cv.width = W; cv.height = H;
  cx.font = `${f.weight} ${S}px ${f.stack}`;
  cx.fillStyle = '#fff'; cx.textBaseline = 'alphabetic';
  cx.fillText(ch, pad, base);
  const data = cx.getImageData(0, 0, W, H).data;
  const m = new Float32Array(W * H);
  for (let i = 0; i < W * H; i++) m[i] = data[i * 4 + 3] / 255;

  // marching squares -> unoriented segments between edge ids
  const adj = new Map();
  const link = (a, b) => {
    (adj.get(a) || adj.set(a, []).get(a)).push(b);
    (adj.get(b) || adj.set(b, []).get(b)).push(a);
  };
  const hId = (x, y) => (y * W + x) * 2, vId = (x, y) => (y * W + x) * 2 + 1;
  const T = [null, [3, 2], [2, 1], [3, 1], [0, 1], [[0, 1], [3, 2]], [0, 2], [0, 3], [0, 3], [0, 2], [[3, 0], [2, 1]], [0, 1], [3, 1], [1, 2], [3, 2], null];
  for (let y = 0; y < H - 1; y++) for (let x = 0; x < W - 1; x++) {
    const tl = m[y * W + x] > .5, tr = m[y * W + x + 1] > .5, br = m[(y + 1) * W + x + 1] > .5, bl = m[(y + 1) * W + x] > .5;
    const c = (tl ? 8 : 0) | (tr ? 4 : 0) | (br ? 2 : 0) | (bl ? 1 : 0);
    const seg = T[c]; if (!seg) continue;
    const E = [hId(x, y), vId(x + 1, y), hId(x, y + 1), vId(x, y)]; // top, right, bottom, left
    if (Array.isArray(seg[0])) seg.forEach(sg => link(E[sg[0]], E[sg[1]])); else link(E[seg[0]], E[seg[1]]);
  }
  const pt = id => {
    const cell = id >> 1, x = cell % W, y = (cell - x) / W;
    if ((id & 1) === 0) { const a = m[cell], b = m[cell + 1]; return [x + (b !== a ? (.5 - a) / (b - a) : .5), y]; }
    const a = m[cell], b = m[cell + W]; return [x, y + (b !== a ? (.5 - a) / (b - a) : .5)];
  };

  const seen = new Set(), loops = [];
  for (const start of adj.keys()) {
    if (seen.has(start)) continue;
    const loop = []; let prev = -1, cur = start;
    while (cur != null && !seen.has(cur)) {
      seen.add(cur); loop.push(pt(cur));
      const nb = adj.get(cur); const next = nb[0] !== prev ? nb[0] : nb[1];
      prev = cur; cur = next;
    }
    if (loop.length > 6) loops.push(loop);
  }

  const rdp = (P, eps) => {
    const keep = new Uint8Array(P.length); keep[0] = keep[P.length - 1] = 1;
    const st = [[0, P.length - 1]];
    while (st.length) {
      const [a, b] = st.pop(); let md = 0, mi = -1;
      const [ax, ay] = P[a], [bx, by] = P[b], dx = bx - ax, dy = by - ay, L = Math.hypot(dx, dy) || 1;
      for (let i = a + 1; i < b; i++) { const d = Math.abs(dy * P[i][0] - dx * P[i][1] + bx * ay - by * ax) / L; if (d > md) { md = d; mi = i; } }
      if (md > eps && mi > 0) { keep[mi] = 1; st.push([a, mi], [mi, b]); }
    }
    return P.filter((_, i) => keep[i]);
  };

  const contours = [];
  loops.forEach(L => {
    let area = 0;
    for (let i = 0; i < L.length; i++) { const a = L[i], b = L[(i + 1) % L.length]; area += a[0] * b[1] - b[0] * a[1]; }
    if (area < 0) L.reverse();
    let si = 0;
    for (let i = 1; i < L.length; i++) if (L[i][1] < L[si][1] - 1e-6 || (Math.abs(L[i][1] - L[si][1]) < 1e-6 && L[i][0] < L[si][0])) si = i;
    const open = L.slice(si).concat(L.slice(0, si)); open.push(open[0]);
    // closed loop: split at the farthest point so the simplifier has a real chord
    let fi = 0, fd = -1;
    for (let i = 1; i < open.length; i++) { const d = Math.hypot(open[i][0] - open[0][0], open[i][1] - open[0][1]); if (d > fd) { fd = d; fi = i; } }
    const P = rdp(open.slice(0, fi + 1), 0.35).concat(rdp(open.slice(fi), 0.35).slice(1));
    const pts = new Float32Array(P.length * 2), cum = new Float32Array(P.length);
    for (let i = 0; i < P.length; i++) {
      pts[i * 2] = (P[i][0] - pad) / S; pts[i * 2 + 1] = (P[i][1] - base) / S;
      if (i) cum[i] = cum[i - 1] + Math.hypot(pts[i * 2] - pts[i * 2 - 2], pts[i * 2 + 1] - pts[i * 2 - 1]);
    }
    if (cum[cum.length - 1] * S > 10) contours.push({ pts, cum, len: cum[cum.length - 1], area: Math.abs(area) });
  });
  contours.sort((a, b) => b.area - a.area); // outer shapes first, counters after
  glyphCache.set(key, contours);
  return contours;
}

const power2InOut = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

const StrokeDraw = {
  id: 'stroke-draw',
  name: 'Stroke Draw',
  langs: ['JS'],
  kind: 'dom',
  groups: [
    { label: 'Motion', controls: [
      { key: 'trigger', label: 'Trigger', type: 'segment', options: [['Hover', 'hover'], ['Click', 'click'], ['Auto loop', 'loop']], def: 'hover' },
      { key: 'dur', label: 'Stroke time', type: 'range', min: 0.2, max: 3, step: 0.05, def: 1.15, unit: 's' },
      { key: 'gap', label: 'Trail gap', type: 'range', min: 0, max: 0.8, step: 0.01, def: 0.25, unit: 's' },
      { key: 'shapeDelay', label: 'Shape delay', type: 'range', min: 0, max: 1, step: 0.01, def: 0.25, unit: 's' },
      { key: 'letterDelay', label: 'Letter delay', type: 'range', min: 0, max: 1, step: 0.01, def: 0.35, unit: 's' },
      { key: 'hold', label: 'Hold (loop)', type: 'range', min: 0, max: 5, step: 0.1, def: 1.5, unit: 's' }
    ]},
    { label: 'Strokes', controls: [
      { key: 'layers', label: 'Trail strokes', type: 'range', min: 0, max: 5, step: 1, def: 5 },
      { key: 'width', label: 'Stroke weight', type: 'range', min: 0.1, max: 2.5, step: 0.05, def: 0.6, unit: '×' },
      { key: 'fill', label: 'Fill letters at end', type: 'toggle', def: false },
      { key: 'fillFade', label: 'Fill fade', type: 'range', min: 0.1, max: 3, step: 0.05, def: 0.8, unit: 's' }
    ]},
    { label: 'Colors', controls: [
      { key: 'cFinal', label: 'Final stroke', type: 'color', def: '#42a6e0' },
      { key: 'c1', label: 'Trail 1', type: 'color', def: '#aaff00' },
      { key: 'c2', label: 'Trail 2', type: 'color', def: '#ffaa00' },
      { key: 'c3', label: 'Trail 3', type: 'color', def: '#aa00ff' },
      { key: 'c4', label: 'Trail 4', type: 'color', def: '#eee8e8' },
      { key: 'c5', label: 'Trail 5', type: 'color', def: '#ff00aa' }
    ]},
    { label: 'Type', controls: [
      { key: 'upper', label: 'Uppercase', type: 'toggle', def: false }
    ]}
  ],
  drawEnd(p, row) {
    const g = row && row.fx ? row.fx.glyphs : [];
    let end = 0;
    g.forEach((G_, li) => { if (G_.contours.length) end = Math.max(end, li * p.letterDelay + (G_.contours.length - 1) * p.shapeDelay); });
    return end + p.layers * p.gap + p.dur;
  },
  total(p, row) { return this.drawEnd(p, row) + (p.fill ? p.fillFade : 0) + (p.trigger === 'loop' ? p.hold : 0); },
  restFrame() { return 1e3; },
  describe(p) { return p.layers ? `${p.layers}-stroke trail` : 'Single stroke'; },

  setup(row) {
    const layer = el('div', 'dom-layer');
    const cv = el('canvas', 'draw-canvas');
    layer.append(cv);
    row.stage.insertBefore(layer, row.tag);
    row.fx = { layer, cv, ctx: cv.getContext('2d'), glyphs: [], fs: 16, box: null };
  },
  layout(row) {
    const fx = row.fx; if (!fx) return;
    const Wc = row.stage.clientWidth, Hc = row.stage.clientHeight;
    if (!Wc || !Hc) return;
    fx.cv.width = Math.round(Wc * DPR); fx.cv.height = Math.round(Hc * DPR);
    const f = FONTS[G.font], text = row.p.upper ? textOf(row).toUpperCase() : textOf(row);
    const ctx = fx.ctx;
    let fs = Hc * G.size;
    ctx.font = `${f.weight} ${fs}px ${f.stack}`;
    let m = ctx.measureText(text);
    if (m.width > Wc * 0.9) { fs *= (Wc * 0.9) / m.width; ctx.font = `${f.weight} ${fs}px ${f.stack}`; m = ctx.measureText(text); }
    const asc = m.actualBoundingBoxAscent || fs * 0.72, desc = m.actualBoundingBoxDescent || 0;
    const x0 = Wc / 2 - m.width / 2, base = Hc / 2 + (asc - desc) / 2;
    const chars = Array.from(text);
    let prefix = '';
    fx.glyphs = chars.filter(ch => true).map(ch => {
      const x = x0 + ctx.measureText(prefix).width; prefix += ch;
      return { ch, x, contours: /\s/.test(ch) ? [] : traceGlyph(ch, G.font) };
    }).filter(g => g.contours.length);
    fx.fs = fs; fx.base = base;
    fx.box = { x0: x0, x1: x0 + m.width, y0: base - asc, y1: base + desc };
    this.render(row, row.clock);
  },
  onParam(row, key) { if (row.fx && (!key || key === 'upper')) this.layout(row); },
  hitRect(row) {
    const b = row.fx.box; if (!b) return null;
    const pad = 0.25 * (b.y1 - b.y0);
    return { x0: b.x0 - pad, x1: b.x1 + pad, y0: b.y0 - pad, y1: b.y1 + pad };
  },
  render(row, c) {
    const fx = row.fx, p = row.p, ctx = fx.ctx;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, fx.cv.width, fx.cv.height);
    if (!fx.glyphs.length) return;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.miterLimit = 10;
    const fs = fx.fs, unit = fs * 0.72 / 130 * p.width;         // pen stroke units → px (cap height ≈ 130 units)
    const trail = [p.c1, p.c2, p.c3, p.c4, p.c5].slice(0, p.layers);
    const layers = trail.map((col, i) => ({ col, w: (i * 2 + 2) * unit })).concat([{ col: p.cFinal, w: 12 * unit }]);

    fx.glyphs.forEach((g, li) => {
      g.contours.forEach((ct, ci) => {
        const t0 = li * p.letterDelay + ci * p.shapeDelay;
        layers.forEach((L, k) => {
          const u = power2InOut(clamp01((c - t0 - k * p.gap) / p.dur));
          if (u <= 0) return;
          const target = u * ct.len, P = ct.pts, C = ct.cum;
          ctx.beginPath();
          ctx.moveTo(g.x + P[0] * fs, fx.base + P[1] * fs);
          for (let i = 1; i < C.length; i++) {
            if (C[i] <= target) { ctx.lineTo(g.x + P[i * 2] * fs, fx.base + P[i * 2 + 1] * fs); continue; }
            const r = (target - C[i - 1]) / Math.max(1e-6, C[i] - C[i - 1]);
            ctx.lineTo(g.x + (P[i * 2 - 2] + (P[i * 2] - P[i * 2 - 2]) * r) * fs, fx.base + (P[i * 2 - 1] + (P[i * 2 + 1] - P[i * 2 - 1]) * r) * fs);
            break;
          }
          if (u >= 1) ctx.closePath();
          ctx.strokeStyle = L.col; ctx.lineWidth = L.w;
          ctx.stroke();
        });
      });
    });

    if (p.fill) {
      const a = clamp01((c - this.drawEnd(p, row)) / p.fillFade);
      if (a > 0) {
        const f = FONTS[G.font];
        ctx.globalAlpha = a; ctx.fillStyle = G.color;
        ctx.font = `${f.weight} ${fs}px ${f.stack}`; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
        fx.glyphs.forEach(g => ctx.fillText(g.ch, g.x, fx.base));
        ctx.globalAlpha = 1;
      }
    }
  }
};

//@region gooey
/* =========================================================
   EFFECT 08 — Gooey Marquee
   After Amit Sheen's "A Gooey Marquee" (codepen.io/amit_sheen/pen/wvORNYm).
   Two layers: a blurred copy composited with contrast() so it melts into the
   gradient walls at each edge, and a clean copy on top for legibility.
   The goo is built in white and tinted by multiply so any color works.
   ========================================================= */
const GooeyMarquee = {
  id: 'gooey-marquee',
  name: 'Gooey Marquee',
  langs: ['CSS', 'JS'],
  kind: 'dom',
  alwaysWrap: true,
  groups: [
    { label: 'Motion', controls: [
      { key: 'trigger', label: 'Trigger', type: 'segment', options: [['Auto loop', 'loop'], ['Hover', 'hover'], ['Click', 'click']], def: 'loop' },
      { key: 'dir', label: 'Direction', type: 'segment', options: [['← Left', 'left'], ['Right →', 'right']], def: 'left' },
      { key: 'mode', label: 'Layout', type: 'segment', options: [['Ticker', 'ticker'], ['Single pass', 'single']], def: 'ticker' },
      { key: 'speed', label: 'Speed', type: 'range', min: 0.1, max: 6, step: 0.05, def: 1.2, unit: 'em/s' },
      { key: 'gap', label: 'Gap between repeats', type: 'range', min: 0, max: 6, step: 0.1, def: 1, unit: 'em' }
    ]},
    { label: 'Goo', controls: [
      { key: 'blur', label: 'Blur', type: 'range', min: 0, max: 0.3, step: 0.005, def: 0.045, unit: 'em' },
      { key: 'contrast', label: 'Contrast', type: 'range', min: 2, max: 40, step: 0.5, def: 21.5 },
      { key: 'edge', label: 'Wall thickness', type: 'range', min: 0.02, max: 1.5, step: 0.01, def: 0.17, unit: 'em' },
      { key: 'wall', label: 'Wall pull', type: 'range', min: 5, max: 60, step: 1, def: 40, unit: '%' },
      { key: 'gooColor', label: 'Goo color', type: 'color', def: '#ffffff' },
      { key: 'clean', label: 'Clean text on top', type: 'toggle', def: false }
    ]},
    { label: 'Band', controls: [
      { key: 'bandH', label: 'Band height', type: 'range', min: 1, max: 4, step: 0.05, def: 1.55, unit: 'em' },
      { key: 'inset', label: 'Side inset', type: 'range', min: 0, max: 30, step: 0.5, def: 15.5, unit: '%' },
      { key: 'upper', label: 'Uppercase', type: 'toggle', def: false }
    ]}
  ],
  period(p, row) {
    const fx = row && row.fx; if (!fx || !fx.unit) return 10;
    const v = Math.max(1e-3, p.speed * fx.fs);
    return p.mode === 'ticker' ? fx.unit / v : (fx.bandW + fx.textW) / v;
  },
  total(p, row) { return this.period(p, row); },
  restFrame() { return 0; },
  describe(p) { return (p.mode === 'ticker' ? 'Ticker' : 'Single pass') + (p.dir === 'left' ? ' ←' : ' →'); },

  onHoverEnter(row) { row.playing = true; row.syncPlay(); },      // runs while hovered
  onHoverLeave(row) { row.playing = false; row.syncPlay(); },     // pauses in place
  onStageClick(row) { row.playing = !row.playing; row.syncPlay(); },

  setup(row) {
    const layer = el('div', 'dom-layer');
    const band = el('div', 'mq-band');
    const goo = el('div', 'mq-goo'), gooIn = el('div', 'mq-goo-in'), tint = el('div', 'mq-tint');
    const clean = el('div', 'mq-clean');
    const trackG = el('div', 'mq-track'), trackC = el('div', 'mq-track'), walls = el('div', 'mq-walls');
    gooIn.append(walls, trackG); goo.append(gooIn, tint); clean.append(trackC);
    band.append(goo, clean); layer.append(band);
    row.stage.insertBefore(layer, row.tag);
    row.fx = { layer, band, gooIn, walls, tint, clean, trackG, trackC, fs: 16, unit: 0, textW: 0, bandW: 0 };
  },
  layout(row) {
    const fx = row.fx; if (!fx) return;
    const p = row.p, f = FONTS[G.font];
    const W = row.stage.clientWidth, H = row.stage.clientHeight;
    if (!W || !H) return;
    const fs = H * G.size;
    fx.fs = fs;
    const bandH = Math.min(H, p.bandH * fs);
    const bandW = Math.max(40, W * (1 - 2 * p.inset / 100));
    fx.band.style.height = bandH + 'px';
    fx.band.style.width = bandW + 'px';
    [fx.trackG, fx.trackC].forEach(t => Object.assign(t.style, { fontFamily: f.stack, fontWeight: String(f.weight), fontSize: fs + 'px' }));
    fx.trackC.style.color = G.color;
    const text = p.upper ? textOf(row).toUpperCase() : textOf(row);
    const mk = () => { const s = el('span', 'mq-copy', text); s.style.paddingRight = (p.mode === 'ticker' ? p.gap : 0) + 'em'; return s; };
    // measure on the goo track: it is always rendered (the clean track can be switched off)
    fx.trackG.textContent = ''; fx.trackG.append(mk());
    fx.unit = fx.trackG.firstChild.offsetWidth || 1;
    const probe = el('span', 'mq-copy', text); fx.trackG.append(probe); fx.textW = probe.offsetWidth; probe.remove();
    fx.bandW = bandW;
    const copies = p.mode === 'ticker' ? Math.ceil(bandW / fx.unit) + 2 : 1;
    [fx.trackG, fx.trackC].forEach(t => { t.textContent = ''; for (let i = 0; i < copies; i++) t.append(mk()); });
    this.style(row);
    this.render(row, row.clock);
  },
  style(row) {
    const fx = row.fx, p = row.p, fs = fx.fs;
    // Amit's gradient: white → transparent with a color HINT at 1rem (the 50% point),
    // so contrast() leaves a thin bar at each edge and a soft pull the goo latches onto.
    const hint = (p.edge * fs + 6).toFixed(1) + 'px';   // +6 offsets the walls' inset
    fx.walls.style.backgroundImage =
      `linear-gradient(to right, #fff, ${hint}, transparent ${p.wall}%),` +
      `linear-gradient(to left, #fff, ${hint}, transparent ${p.wall}%)`;
    fx.gooIn.style.filter = `contrast(${p.contrast})`;
    fx.trackG.style.filter = p.blur > 0 ? `blur(${p.blur * fs}px)` : 'none';
    fx.tint.style.backgroundColor = p.gooColor;
    fx.clean.hidden = !p.clean;
  },
  onParam(row, key) {
    if (!row.fx) return;
    if (key === 'trigger' && row.p.trigger !== 'loop') { row.playing = false; row.syncPlay(); }
    if (!key || key === 'upper' || key === 'gap' || key === 'mode' || key === 'bandH' || key === 'inset') this.layout(row);
    else this.style(row);
  },
  hitRect(row) {
    const s = row.stage.getBoundingClientRect(), r = row.fx.band.getBoundingClientRect();
    return { x0: r.left - s.left, x1: r.right - s.left, y0: r.top - s.top, y1: r.bottom - s.top };
  },
  render(row, c) {
    const fx = row.fx, p = row.p;
    const v = p.speed * fx.fs, d = c * v;
    let x;
    if (p.mode === 'ticker') {
      const off = d % fx.unit;
      x = p.dir === 'left' ? -off : -fx.unit + off;
    } else {
      x = p.dir === 'left' ? fx.bandW - d : -fx.textW + d;
    }
    const tf = `translate3d(${x}px, -50%, 0)`;
    fx.trackG.style.transform = tf;
    fx.trackC.style.transform = tf;
  }
};

/* =========================================================
   EFFECT 09 — Jello
   After Pete Barr's "Jello Stretchy Variable Font" (codepen.io/petebarr/pen/LYzBoeg).
   Letters drop in on an elastic ease; grab any letter and drag up or down to
   stretch it — neighbours follow with a falloff, weight and width shift on the
   variable-font axes, and the word snaps back like jelly on release.
   The pen's GT Flexa can't load here, so Roboto Flex / Anybody supply the axes.
   ========================================================= */
const elasticOutG = (a, per) => { // GSAP elastic.out(amplitude, period)
  const p1 = a >= 1 ? a : 1; let p2 = per / (a < 1 ? a : 1);
  const p3 = p2 / (2 * Math.PI) * (Math.asin(1 / p1) || 0); p2 = 2 * Math.PI / p2;
  return p => p <= 0 ? 0 : p >= 1 ? 1 : p1 * Math.pow(2, -10 * p) * Math.sin((p - p3) * p2) + 1;
};
const power4Out = t => 1 - Math.pow(1 - clamp01(t), 5);
const JELLO_FONTS = {
  flex: { gf: 'Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000', family: 'Roboto Flex', stack: '"Roboto Flex", "Helvetica Neue", Arial, sans-serif', variable: true },
  anybody: { gf: 'Anybody:wdth,wght@50..150,100..900', family: 'Anybody', stack: '"Anybody", "Arial Black", sans-serif', variable: true },
  shared: null
};

const Jello = {

  langs: ['JS', 'CSS'],
  kind: 'dom',
  groups: [
    { label: 'Playback', controls: [
      { key: 'trigger', label: 'Replay drop-in on', type: 'segment', grid: 2, options: [['Drag only', 'drag'], ['Hover', 'hover'], ['Click', 'click'], ['Auto demo', 'loop']], def: 'drag' },
      { key: 'dropDur', label: 'Drop time', type: 'range', min: 0.3, max: 4, step: 0.05, def: 1.5, unit: 's' },

      { key: 'wRest', label: 'Weight at rest', type: 'range', min: 100, max: 1000, step: 10, def: 600 },

      const now = performance.now() / 1000;

    };

    wrap.addEventListener('pointercancel', end);
  },
  font(row) { return JELLO_FONTS[row.p.jfont] || null; },
  layout(row) {
    const fx = row.fx; if (!fx) return;
    const p = row.p, jf = this.font(row), sf = FONTS[G.font];
    const text = textOf(row);
    fx.wrap.textContent = '';
    const letters = [];
    for (const ch of Array.from(text)) {
      if (/\s/.test(ch)) { fx.wrap.append(el('span', 'sp')); continue; }
      const sp = el('span', 'ch', ch); fx.wrap.append(sp); letters.push({ el: sp });
    }
    fx.wrap.style.fontFamily = jf ? jf.stack : sf.stack;
    fx.wrap.style.fontWeight = jf ? '' : String(sf.weight);
    fx.wrap.style.color = G.color;
    fx.wrap.style.letterSpacing = p.track + 'em';
    fx.wrap.style.textShadow = p.shadow
      ? `0 0.05em 0 ${p.shadowColor}, 0 0.1em 0.1em rgba(70,0,35,.3), 0 0.4em 0.3em rgba(70,0,35,.1)` : 'none';

    if (fx.live.length !== letters.length) fx.live = letters.map(() => ({ f: 0, snap: null }));
    if (fx.order.length !== letters.length) this.onRestart(row);

    letters.forEach(L => this.applyAxes(row, L.el, p.wRest, p.sRest, 1, 0));
    const W = row.stage.clientWidth, H = row.stage.clientHeight;
    let fs = H * G.size;
    fx.wrap.style.fontSize = fs + 'px';
    const w = fx.wrap.offsetWidth;
    if (w > W * 0.9 && w > 0) { fs *= (W * 0.9) / w; fx.wrap.style.fontSize = fs + 'px'; }

  applyAxes(row, e, w, s, sy, y) {

      e.style.transform = `translateY(${y}px) scaleY(${sy})`;

      e.style.fontVariationSettings = '';

  onCycle(row) { this.onRestart(row); },
  onParam(row, key) {

  onStageClick(row) {

  hint(p) {

  hitRect(row) { return lettersHitRect(row); },

  render(row, c) {
    const fx = row.fx, p = row.p, n = fx.letters.length;
    const now = performance.now() / 1000, dt = Math.min(0.1, now - (fx.lastT || now)); fx.lastT = now;
    const dropEase = elasticOutG(p.dropBounce, 0.1);
    const snapEase = elasticOutG(p.snapBounce, 0.1);
    const drop = -(row.stage.clientHeight + fx.fs);
    const span = n * p.falloff;

    const d = fx.drag;
    fx.live.forEach((L, i) => {
      if (d) {
        const target = (1 - Math.abs(i - d.i) / span) * d.scale;
        L.f += (target - L.f) * (1 - Math.exp(-dt * 7));

    let demoScale = 0;
    const D = p.trigger === 'loop' ? this.demo(p, row) : null;

    fx.letters.forEach((L, i) => {
      // drop-in ("from" tween: y, weight, width, scaleY → rest)
      const u = clamp01((c - 0.2 - (fx.order[i] || 0) * p.dropStagger) / p.dropDur);
      const e = dropEase(u);
      let y = (1 - e) * drop;
      let w = p.wPull + (p.wRest - p.wPull) * e;
      let st = p.sPull + (p.sRest - p.sPull) * e;
      let sy = 2 + (1 - 2) * e;

      let f = fx.live[i] ? fx.live[i].f : 0;
      if (D && c >= D.pullAt) {
        const fall = 1 - Math.abs(i - fx.demoSel) / span, amt = Math.min(1, p.maxScale - 1);

        if (c < D.heldAt) k = power4Out((c - D.pullAt) / 0.6);
        else if (c < D.snapAt) k = 1;
        else k = 1 - snapEase(clamp01((c - D.snapAt - 0.02 * Math.abs(i - fx.demoSel)) / p.snapDur));
        f += fall * amt * k;
      }
      if (u >= 1 || f !== 0) {
        y += f * -p.lift * fx.fs;
        w = p.wRest - f * (p.wRest - p.wPull);
        st = p.sRest - f * (p.sRest - p.sPull);
        sy = Math.max(0.5, (u >= 1 ? 1 : sy) + f);
      }
      this.applyAxes(row, L.el, w, st, sy, y);
    });
  }
};

//@endregion
//@region shards
/* =========================================================
   EFFECT 10 — Shard Wind
   After the "Gone With The Wind" particle text (three.js + BAS). The words are
   cut into triangle shards; each shard rides its own cubic Bézier on the GPU,
   spinning in 3D and shrinking, swept left→right, then the timeline yoyos back
   so the text reforms. Drag across the stage to scrub.
   ========================================================= */
const SHARD_VERT = `#version 300 es
precision highp float;
in vec2 aPos; in vec2 aCen; in vec2 aUv;
in vec4 aR0; in vec4 aR1; in vec4 aR2; in vec4 aR3;
uniform vec2 uCanvas;
uniform float uTime, uFs, uK;
uniform float uDelayX, uDelayY, uDurMin, uDurMax, uStretch;
uniform float uWind, uLift, uDepth, uSpin, uShrink;
out vec2 vUv; out float vShade; out float vP;

vec3 rotQ(vec4 q, vec3 v) { return v + 2.0 * cross(q.xyz, cross(q.xyz, v) + q.w * v); }
vec3 bez(vec3 a, vec3 b, vec3 c, vec3 d, float t) {
  float n = 1.0 - t;
  return n*n*n*a + 3.0*n*n*t*b + 3.0*n*t*t*c + t*t*t*d;
}
float easeInOutCubic(float t) { return t < 0.5 ? 4.0*t*t*t : 1.0 - pow(-2.0*t + 2.0, 3.0) / 2.0; }

void main() {
  float sweep = uWind >= 0.0 ? aR3.z : 1.0 - aR3.z;
  float dur = mix(uDurMin, uDurMax, aR0.x);
  float delay = sweep * uDelayX + (1.0 - aR3.w) * uDelayY + aR0.y * uStretch * dur;
  float p = easeInOutCubic(clamp((uTime - delay) / dur, 0.0, 1.0));

  float th = aR0.z * 6.2831853, ph = acos(2.0 * aR0.w - 1.0);
  vec3 axis = vec3(sin(ph) * cos(th), sin(ph) * sin(th), cos(ph));
  float ang = mix(1.0, 4.0, aR1.w) * 3.14159265 * uSpin * p;
  vec4 q = vec4(axis * sin(ang * 0.5), cos(ang * 0.5));

  vec3 local = rotQ(q, vec3(aPos - aCen, 0.0)) * (1.0 - uShrink * p);
  vec3 c  = vec3(aCen, 0.0);
  vec3 c0 = vec3(mix(2.0, 6.0, aR1.x) * uWind,  -mix(-1.0, 2.0, aR1.y) * uLift, (aR1.z * 2.0 - 1.0) * 4.0 * uDepth) * uFs;
  vec3 c1 = vec3(mix(6.0, 12.0, aR2.x) * uWind, -mix(-2.0, 3.0, aR2.y) * uLift, (aR2.z * 2.0 - 1.0) * 6.0 * uDepth) * uFs;
  vec3 e  = vec3(mix(10.0, 18.0, aR2.w) * uWind, -mix(1.0, 5.0, aR3.x) * uLift, (aR3.y * 2.0 - 1.0) * 8.0 * uDepth) * uFs;
  vec3 w  = bez(c, c + c0, c + c1, c + e, p) + local;

  float persp = max(0.2, 1.0 - w.z * uK);
  gl_Position = vec4(w.x / uCanvas.x * 2.0 - 1.0, 1.0 - w.y / uCanvas.y * 2.0, 0.0, persp);

  vec3 n = rotQ(q, vec3(0.0, 0.0, 1.0));
  vShade = abs(dot(n, normalize(vec3(-0.4, -0.6, 1.0))));
  vUv = aUv; vP = p;
}`;
const SHARD_FRAG = `#version 300 es
precision highp float;
uniform sampler2D src;
uniform float uLight, uTintAmt, uFade;
uniform vec3 uTint;
in vec2 vUv; in float vShade; in float vP;
out vec4 outColor;
void main() {
  vec4 t = texture(src, vUv);
  vec3 rgb = mix(t.rgb, uTint * t.a, uTintAmt * vP);
  rgb *= mix(1.0, 0.3 + 0.95 * vShade, uLight);
  float a = 1.0 - smoothstep(0.55, 1.0, vP) * uFade;
  outColor = vec4(rgb, t.a) * a;
}`;
const mulberry32 = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

const ShardWind = {
  id: 'shard-wind',
  name: 'Shard Wind',
  langs: ['JS', 'GLSL'],
  kind: 'dom',
  hoverHold: true, // hover blows the words away; leaving reforms them
  groups: [
    { label: 'Playback', controls: [
      { key: 'trigger', label: 'Trigger', type: 'segment', options: [['Auto loop', 'loop'], ['Hover', 'hover'], ['Click', 'click']], def: 'loop' },
      { key: 'speed', label: 'Speed', type: 'range', min: 0.2, max: 4, step: 0.05, def: 1.5, unit: '×' },
      { key: 'hold', label: 'Pause at each end', type: 'range', min: 0, max: 4, step: 0.05, def: 0, unit: 's' }
    ]},
    { label: 'Timing', controls: [
      { key: 'delayX', label: 'Sweep across', type: 'range', min: 0, max: 5, step: 0.05, def: 1.5, unit: 's' },
      { key: 'delayY', label: 'Vertical spread', type: 'range', min: 0, max: 1.5, step: 0.01, def: 0.61, unit: 's' },
      { key: 'durMin', label: 'Shortest flight', type: 'range', min: 0.2, max: 8, step: 0.1, def: 0.8, unit: 's' },
      { key: 'durMax', label: 'Longest flight', type: 'range', min: 0.2, max: 12, step: 0.1, def: 3, unit: 's' },

    { label: 'Wind', controls: [

      { key: 'lift', label: 'Lift', type: 'range', min: -3, max: 3, step: 0.05, def: 1 },
      { key: 'depth', label: 'Depth', type: 'range', min: 0, max: 3, step: 0.05, def: 1 },
      { key: 'spin', label: 'Spin', type: 'range', min: 0, max: 3, step: 0.05, def: 1, unit: '×' },

  holdAt(p) { return this.phases(p).holdAt; },
  releaseAt(p) { return this.phases(p).releaseAt; },
  captureRelease(row) { row.releaseFrom = row.fx ? row.fx.lastU : null; },
  describe(p) { return p.wind >= 0 ? 'Blows right' : 'Blows left'; },
  hint(p) {

  setup(row) {

  onStageClick(row) {

  },
  onHoverEnter(row) {

  onParam(row, key) { if (row.fx && (!key || key === 'shard' || key === 'seed')) this.layout(row); },
  hitRect(row) {

  render(row, c) {

/* =========================================================
   EFFECT 02 — Bump
   From Rob's landing page (makeBump): a WebGL lens that bulges the words
   around the cursor. Each pixel inside the radius samples closer to the lens
   centre (magnify) or farther from it (pinch); the falloff is a doubly
   smoothed step so the edge stays soft. The lens grows in on enter, shrinks
   out on leave, and trails the pointer.

const BUMP_FRAG = `#version 300 es
precision highp float;
uniform sampler2D src;
uniform vec2 canvasSize, offset, resolution;   // lens frame = words + padding
uniform vec2 uMouse;                           // lens centre in frame uv (y up)
uniform float uAmount, uRadius, uStrength, uHard, uSplit;
out vec4 outColor;
vec2 toTex(vec2 uv) { return (offset + uv * resolution) / canvasSize; }
float grab(vec2 uv, int ch) {
  vec2 t = toTex(uv);
  if (t.x < 0.0 || t.x > 1.0 || t.y < 0.0 || t.y > 1.0) return 0.0;
  return texture(src, t)[ch];
}
void main() {
  vec2 uv = (gl_FragCoord.xy - offset) / resolution;
  vec2 d = uv - uMouse; d.x *= resolution.x / resolution.y;
  float infl = smoothstep(uRadius, uRadius * uHard, length(d));
  infl = infl * infl * (3.0 - 2.0 * infl);
  float amt = infl * uStrength * uAmount;
  vec2 v = uv - uMouse;
  float r = grab(uv - v * amt * (1.0 + uSplit), 0);
  float g = grab(uv - v * amt, 1);
  float b = grab(uv - v * amt * (1.0 - uSplit), 2);
  float a = grab(uv - v * amt, 3);
  outColor = vec4(r, g, b, 1.0);
}`;

/* ---------- text rasterizer ---------- */
function rasterText(ctx, w, h, text) {
  ctx.clearRect(0, 0, w, h);
  const f = FONTS[G.font];
  // Measure and draw left-aligned: bounding-box metrics are consistent across browsers this way
  // (Safari reports center-aligned bounds relative to the wrong origin).
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  let px = h * G.size;
  ctx.font = `${f.weight} ${px}px ${f.stack}`;
  let m = ctx.measureText(text);
  const maxW = w * 0.9;
  if (m.width > maxW) { px *= maxW / m.width; ctx.font = `${f.weight} ${px}px ${f.stack}`; m = ctx.measureText(text); }
  ctx.fillStyle = G.color;
  const asc = m.actualBoundingBoxAscent || px * 0.72;
  const desc = m.actualBoundingBoxDescent || 0;
  const base = h / 2 + (asc - desc) / 2;
  const start = w / 2 - m.width / 2;
  ctx.fillText(text, start, base);
  if (!text.trim()) return { x0: w / 2 - 1, x1: w / 2 + 1, y0: h / 2 - px / 2, y1: h / 2 + px / 2 };
  // glyph bounds, unioned with the advance box so the frame can never clip the words
  const gl = Number.isFinite(m.actualBoundingBoxLeft) ? start - m.actualBoundingBoxLeft : start;
  const gr = Number.isFinite(m.actualBoundingBoxRight) ? start + m.actualBoundingBoxRight : start + m.width;
  return { x0: Math.min(gl, start), x1: Math.max(gr, start + m.width), y0: base - asc, y1: base + desc };
}
