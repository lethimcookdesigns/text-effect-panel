    if (!this.def.hoverHold || this.holdAt == null) return;
    if (this.def.captureRelease) this.def.captureRelease(this);
    this.holdAt = null;
    this.clock = this.def.releaseAt(this.p, this);
    this.playing = true; this.syncPlay();
  }

  hitRect() {
    if (this.def.kind === 'dom') return this.fx ? this.def.hitRect(this) : null;
    if (!this.box) return null;
    const k = this.canvas.width / Math.max(1, this.stage.clientWidth);
    const b = this.box, pad = this.p.pad * (b.y1 - b.y0);
    return { x0: (b.x0 - pad) / k, x1: (b.x1 + pad) / k, y0: (b.y0 - pad) / k, y1: (b.y1 + pad) / k };
  }
  inFrame(e) {
    const b = this.hitRect(); if (!b) return false;
    const r = this.stage.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    return x >= b.x0 && x <= b.x1 && y >= b.y0 && y <= b.y1;
  }

  makeControl(c) {
    const id = `${this.def.id}-${c.key}`;
    const wrap = el('div', c.type === 'toggle' ? 'ctl switch-row' : 'ctl');
    if (c.type === 'range') {
      const head = el('div', 'ctl-head');
      const lab = el('label', null, c.label); lab.htmlFor = id;
      const out = el('output'); out.htmlFor = id;
      const inp = el('input'); inp.type = 'range'; inp.id = id;
      inp.min = c.min; inp.max = c.max; inp.step = c.step;
      const dp = decimals(c.step);
      const set = v => {
        inp.value = v;
        out.textContent = Number(v).toFixed(dp) + (c.unit || '');
        inp.style.setProperty('--pct', ((v - c.min) / (c.max - c.min) * 100) + '%');
      };
      inp.addEventListener('input', () => { this.p[c.key] = parseFloat(inp.value); set(this.p[c.key]); this.onParam(c.key); });
      head.append(lab, out);
      wrap.append(head, inp);
      this.ctrl[c.key] = set; set(this.p[c.key]);
    } else if (c.type === 'segment') {
      const head = el('div', 'ctl-head'); head.append(el('span', 'name', c.label));
      const seg = el('div', c.grid ? `seg grid${c.grid === true ? 3 : c.grid}` : 'seg'); seg.setAttribute('role', 'group'); seg.setAttribute('aria-label', c.label);
      const btns = c.options.map(([label, val], i) => {
        const b = el('button', null, label); b.type = 'button'; b.id = `${id}-${i}`;
        b.onclick = () => { this.p[c.key] = val; set(val); this.onParam(c.key); };
        seg.append(b); return [b, val];
      });
      const set = v => btns.forEach(([b, val]) => b.setAttribute('aria-pressed', String(val === v)));
      wrap.append(head, seg);
      this.ctrl[c.key] = set; set(this.p[c.key]);
    } else if (c.type === 'color') {
      const lab = el('label', 'name', c.label); lab.htmlFor = id; lab.style.fontSize = '12px';
      const inp = el('input', 'swatch'); inp.type = 'color'; inp.id = id;
      const set = v => { inp.value = v; };
      inp.addEventListener('input', () => { this.p[c.key] = inp.value; this.onParam(c.key); });
      wrap.className = 'ctl switch-row';
      wrap.append(lab, inp);
      this.ctrl[c.key] = set; set(this.p[c.key]);
    } else if (c.type === 'toggle') {
      const lab = el('span', 'name', c.label); lab.style.fontSize = '12px';
      const sw = el('button', 'switch'); sw.type = 'button'; sw.id = id; sw.setAttribute('role', 'switch'); sw.setAttribute('aria-label', c.label);
      const set = v => sw.setAttribute('aria-checked', String(!!v));
      sw.onclick = () => {
        this.p[c.key] = !this.p[c.key]; set(this.p[c.key]); this.onParam(c.key);
      };
      wrap.append(lab, sw);
      this.ctrl[c.key] = set; set(this.p[c.key]);
    }
    return wrap;
  }

  initGL() {
    const gl = this.canvas.getContext('webgl2', { antialias: false, alpha: false, premultipliedAlpha: false });
    if (!gl) return this.fail('This effect needs WebGL 2. Turn on hardware acceleration in your browser settings and reload.');
    const sh = (type, src) => {
      const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); return null; }
      return s;
    };
    const vs = sh(gl.VERTEX_SHADER, VERT), fs = sh(gl.FRAGMENT_SHADER, this.def.frag);
    if (!vs || !fs) return this.fail('The shader for this effect failed to compile on this device.');
    const prog = gl.createProgram();
    gl.attachShader(prog, vs); gl.attachShader(prog, fs);
    gl.bindAttribLocation(prog, 0, 'pos');
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(prog)); return this.fail('The shader for this effect failed to link on this device.'); }
    const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
    const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.useProgram(prog);
    gl.uniform1i(gl.getUniformLocation(prog, 'src'), 0);
    const u = {}; this.def.uniforms.forEach(n => u[n] = gl.getUniformLocation(prog, n));
    Object.assign(this, { gl, prog, tex, u });
    this.textCanvas = document.createElement('canvas');
    this.tctx = this.textCanvas.getContext('2d');
  }
  fail(msg) { this.gl = null; this.stage.append(el('div', 'stage-err', msg)); }

  resize() {
    if (this.def.kind === 'dom') { this.def.layout(this); return; }
    const w = Math.max(1, Math.round(this.stage.clientWidth * DPR));
    const h = Math.max(1, Math.round(this.stage.clientHeight * DPR));
    if (w === this.canvas.width && h === this.canvas.height && this.texReady) return;
    this.canvas.width = w; this.canvas.height = h;
    if (!this.gl) return;
    this.textCanvas.width = w; this.textCanvas.height = h;
    this.updateText();
  }
  updateText() {
    if (this.def.kind === 'dom') { this.def.layout(this); return; }
    if (!this.gl) return;
    const gl = this.gl, w = this.textCanvas.width, h = this.textCanvas.height;
    this.box = rasterText(this.tctx, w, h, textOf(this));
    gl.bindTexture(gl.TEXTURE_2D, this.tex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, this.textCanvas);
    gl.generateMipmap(gl.TEXTURE_2D);
    this.texReady = true;
  }

  frame(dt) {
    const total = this.def.total(this.p, this);
    if (this.playing) {
      this.clock += dt;
      if (this.holdAt != null && this.clock >= this.holdAt) this.clock = this.holdAt;
      else if ((this.p.trigger === 'loop' || this.def.alwaysWrap) && this.clock >= total) {
        if (this.def.onCycle) { this.clock = 0; this.def.onCycle(this); }
        else this.clock %= total;
      }
      else if (this.clock >= total) { this.clock = total; this.playing = false; this.syncPlay(); }
    } else if (this.clock > total) this.clock = total;
    const v = total > 0 ? this.clock / total : 0;
    if (document.activeElement !== this.scrub) this.scrub.value = Math.round(v * 1000);
    this.scrub.style.setProperty('--pct', (v * 100) + '%');
    this.tlOut.textContent = `${this.clock.toFixed(2)}s / ${total.toFixed(2)}s`;
    if (this.def.kind === 'dom') { if (this.fx) this.def.render(this, this.clock); return; }
    if (!this.gl || !this.texReady) return;
    const s = this.def.stateAt(this.p, this.clock, this);
    const gl = this.gl;
    gl.viewport(0, 0, this.canvas.width, this.canvas.height);
    gl.useProgram(this.prog);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, this.tex);
    this.def.apply(gl, this.u, this.p, s, this.canvas.width, this.canvas.height, this.box);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  replay() {
    this.clock = 0; this.holdAt = null; this.releaseFrom = null;
    if (this.def.onRestart) this.def.onRestart(this);
    this.playing = true; this.syncPlay();
  }
  togglePlay() {
    if (!this.playing && this.p.trigger !== 'loop' && this.clock >= this.def.total(this.p, this) - 1e-4) this.clock = 0;
    this.playing = !this.playing; this.syncPlay();
  }
  syncPlay() { this.bPlay.textContent = this.playing ? 'Pause' : 'Play'; }
  reset() {
    this.p = this.defaults();
    Object.entries(this.ctrl).forEach(([k, set]) => set(this.p[k]));
    this.onParam();
    this.copyBox.hidden = true;
    this.replay();
  }
  async copy() {
    const json = JSON.stringify({ effect: this.def.name, text: textOf(this), font: G.font, size: G.size, color: G.color, ...this.p }, null, 2);
    try {
      await navigator.clipboard.writeText(json);
      this.bCopy.textContent = 'Copied';
      setTimeout(() => this.bCopy.textContent = 'Copy values', 1400);
    } catch (e) {
      this.copyBox.value = json; this.copyBox.hidden = false;
      this.copyBox.focus(); this.copyBox.select();
      this.bCopy.textContent = 'Select and copy below';
      setTimeout(() => this.bCopy.textContent = 'Copy values', 2200);
    }
  }
}

//@endregion

/* ---------- mount ---------- */
const stack = document.getElementById('stack');
const rows = EFFECTS.map((d, i) => { const r = new FxRow(d, i); stack.append(r.row); return r; });
document.getElementById('fxCount').textContent = `${rows.length} effect${rows.length === 1 ? '' : 's'}`;

const refreshText = () => rows.forEach(r => r.updateText());
async function loadFontThenRefresh() {
  const f = FONTS[G.font];
  if (!f.system && document.fonts && document.fonts.load) {
    try { await document.fonts.load(`${f.weight} 80px "${f.family || G.font}"`, G.text); } catch (e) {}
  }
  refreshText();
}

const fontSel = document.getElementById('gFont');
Object.keys(FONTS).forEach(n => { const o = el('option', null, n); o.value = n; fontSel.append(o); });
fontSel.value = G.font;
fontSel.addEventListener('change', () => { G.font = fontSel.value; loadFontThenRefresh(); });

const gText = document.getElementById('gText');
gText.addEventListener('input', () => {
  G.text = gText.value;
  rows.forEach(r => { if (r.textInput) r.textInput.placeholder = G.text; });
  refreshText();
});

const gSize = document.getElementById('gSize'), gSizeOut = document.getElementById('gSizeOut');
const setSize = v => { gSizeOut.textContent = Math.round(v * 100) + '%'; gSize.style.setProperty('--pct', ((v - 0.08) / (0.6 - 0.08) * 100) + '%'); };
setSize(G.size);
gSize.addEventListener('input', () => { G.size = parseFloat(gSize.value); setSize(G.size); refreshText(); });

const gColor = document.getElementById('gColor');
gColor.addEventListener('input', () => { G.color = gColor.value; refreshText(); });

document.getElementById('replayAll').onclick = () => rows.forEach(r => r.replay());

loadFontThenRefresh();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(refreshText);

/* ---------- downloads: each effect exports as a standalone mini-site ---------- */
const EXPORTS = {
  'pixel-scan':    { name: 'PixelScan',    js: ['core', 'pixel-scan', 'engine'],       css: ['stage'] },
  'spark-text':    { name: 'SparkText',    js: ['core', 'letters', 'spark', 'engine'], css: ['stage', 'letters', 'spark'] },
  'smoky-text':    { name: 'SmokyText',    js: ['core', 'letters', 'smoky', 'engine'], css: ['stage', 'letters', 'smoky'] },
  'entrance-reel': { name: 'EntranceReel', js: ['core', 'letters', 'reel', 'engine'],  css: ['stage', 'letters', 'reel'] },
  'erode':         { name: 'Erode',        js: ['core', 'erode', 'engine'],            css: ['stage'] },
  'stroke-draw':   { name: 'StrokeDraw',   js: ['core', 'stroke', 'engine'],           css: ['stage', 'stroke'] },
  'gooey-marquee': { name: 'GooeyMarquee', js: ['core', 'gooey', 'engine'],            css: ['stage', 'gooey'] },
  'jello':         { name: 'Jello',        js: ['core', 'letters', 'jello', 'engine'], css: ['stage', 'letters', 'jello'] },
  'shard-wind':    { name: 'ShardWind',    js: ['core', 'shards', 'engine'],           css: ['stage', 'stroke'] },
  'bump':          { name: 'Bump',         js: ['core', 'bump', 'engine'],             css: ['stage', 'stroke'] }
};
const regions = (text, open, close) => {
  const out = {}, re = new RegExp(open + '([\\w-]+)' + close.a + '([\\s\\S]*?)' + close.b, 'g');
  let m; while ((m = re.exec(text))) out[m[1]] = m[2].replace(/^\n+|\s+$/g, '');
  return out;
};
const JS_REGIONS = regions(SRC, '//@region ', { a: '\\n', b: '//@endregion' });
const CSS_SRC = (document.querySelector('style') || {}).textContent || '';
const CSS_REGIONS = regions(CSS_SRC, '/\\*@region ', { a: '\\*/', b: '/\\*@endregion\\*/' });
const escHTML = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function buildExport(row) {
  const d = row.def, x = EXPORTS[d.id];
  const text = textOf(row), stamp = new Date().toISOString().slice(0, 10);
  const settings = JSON.stringify(row.p, null, 2).replace(/\n/g, '\n');
  const families = new Set();
  if (FONTS[G.font] && FONTS[G.font].gf) families.add(FONTS[G.font].gf);
  if (d.id === 'jello' && JELLO_FONTS[row.p.jfont]) families.add(JELLO_FONTS[row.p.jfont].gf);
  const fontsHref = families.size ? 'https://fonts.googleapis.com/css2?' + [...families].map(f => 'family=' + f).join('&') + '&display=swap' : '';

  const html = `<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${escHTML(d.name)} · ${escHTML(text)}</title>
${fontsHref ? `<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="${escHTML(fontsHref)}">
` : ''}<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="fx-root" aria-label="${escHTML(text)}"></main>
<script src="script.js"><\/script>
</body>
</html>
`;

  const css = `/* ${d.name} — exported from Text Effect Panel on ${stamp} */
:root { --stage: #000000; --muted: #878a90; --fg: #ecebe7; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--stage); }
#fx-root { position: fixed; inset: 0; }
.fx-row { position: absolute; inset: 0; overflow: hidden; background: var(--stage); }
[hidden] { display: none !important; }

${x.css.map(r => CSS_REGIONS[r] || '').join('\n\n')}
`;

  const js = `/* ${d.name} — exported from Text Effect Panel on ${stamp}
   Open index.html in a browser. Edit the settings block at the bottom of this file to tweak it. */
(() => {
'use strict';

${x.js.map(r => JS_REGIONS[r] || '').join('\n\n')}

/* ---------- your settings ---------- */
G.text = ${JSON.stringify(text)};
G.font = ${JSON.stringify(G.font)};
G.size = ${JSON.stringify(G.size)};   // text height as a fraction of the stage height
G.color = ${JSON.stringify(G.color)};
const SETTINGS = ${settings};

/* ---------- run ---------- */
const row = new FxRow(${x.name}, 0, { headless: true, params: SETTINGS });
document.getElementById('fx-root').append(row.row);
const refresh = () => row.updateText();
(async () => {
  const f = FONTS[G.font];
  if (!f.system && document.fonts && document.fonts.load) {
    try { await document.fonts.load(\`\${f.weight} 80px "\${f.family || G.font}"\`, G.text); } catch (e) {}
  }
  refresh();
})();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(refresh);
let last = performance.now();
(function tick(now) {
  const dt = Math.min(0.1, ((now || last) - last) / 1000); last = now || last;
  row.frame(dt);
  requestAnimationFrame(tick);
})();
})();
`;

  const readme = `${d.name}
Exported from Text Effect Panel on ${stamp}.

Files
  index.html  the page. Open it in any modern browser (double-click works).
  style.css   stage and effect styles.
  script.js   the effect, with your settings at the bottom.

Your settings
  Text:  ${text}
  Font:  ${G.font}${d.id === 'jello' ? ' (Jello uses ' + row.p.jfont + ')' : ''}
  Size:  ${Math.round(G.size * 100)}% of the stage height
  Color: ${G.color}
${Object.entries(row.p).map(([k, v]) => '  ' + k + ': ' + v).join('\n')}

To put it on another page, copy the <main id="fx-root"> element and the two file
references into that page, then give #fx-root the size you want.
${d.kind === 'dom' ? '' : 'This effect draws with WebGL 2, which every current browser supports.\n'}`;

  const folder = d.id + '/';
  return makeZip([
    [folder + 'index.html', html],
    [folder + 'style.css', css],
    [folder + 'script.js', js],
    [folder + 'README.txt', readme]
  ]);
}

/* minimal store-only ZIP writer */
const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_TABLE[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
function makeZip(entries) {
  const enc = new TextEncoder(), now = new Date();
  const time = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  const date = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  const parts = [], central = []; let offset = 0;
  entries.forEach(([name, text]) => {
    const nameB = enc.encode(name), data = enc.encode(text), crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
    h.setUint16(10, time, true); h.setUint16(12, date, true); h.setUint32(14, crc, true);
    h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, nameB.length, true); h.setUint16(28, 0, true);
    parts.push(h.buffer, nameB, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
    c.setUint16(12, time, true); c.setUint16(14, date, true); c.setUint32(16, crc, true);
    c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, nameB.length, true);
    c.setUint16(30, 0, true); c.setUint16(32, 0, true); c.setUint16(34, 0, true); c.setUint16(36, 0, true); c.setUint32(38, 0, true); c.setUint32(42, offset, true);
    central.push(c.buffer, nameB);
    offset += 30 + nameB.length + data.length;
  });
  const cdSize = central.reduce((a, b) => a + b.byteLength, 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, entries.length, true); e.setUint16(10, entries.length, true);
  e.setUint32(12, cdSize, true); e.setUint32(16, offset, true);
  return new Blob([...parts, ...central, e.buffer], { type: 'application/zip' });
}

/* Inside Claude, saves go through the viewer's downloads capability (with a confirm prompt).
   Hosted anywhere else (e.g. Vercel), the button falls back to a normal browser download. */
let downloadsApi = null;
const inClaude = !!(window.claude && typeof window.claude.use === 'function');
function browserSave(filename, blob) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.rel = 'noopener';
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
async function downloadEffect(row) {
  if (inClaude && !downloadsApi) return;
  const b = row.bDownload, label = b.querySelector('span'), st = row.dlStatus;
  const note = (msg) => { st.textContent = msg; st.hidden = !msg; };
  b.disabled = true; label.textContent = 'Preparing…'; note('');
  try {
    const blob = buildExport(row);
    if (downloadsApi) await downloadsApi.save({ filename: row.def.id + '.zip', data: blob });
    else browserSave(row.def.id + '.zip', blob);
    note('Saved ' + row.def.id + '.zip');
  } catch (err) {
    const code = err && err.code;
    if (code === 'declined') note('');
    else if (code === 'rate_limited') note('A save prompt is already open. Finish that one first.');
    else if (code === 'unavailable' || code === 'not_granted' || code === 'capability_disabled' || code === 'capability_removed') { note('Downloads aren’t available in this view.'); }
    else note('Couldn’t prepare the download. Try again.');
  } finally {
    b.disabled = false; label.textContent = 'Download';
  }
}
if (inClaude) {
  window.claude.use('downloads').then(api => {
    downloadsApi = api;
    if (api) rows.forEach(r => { r.bDownload.hidden = false; });
  }).catch(() => {});
} else {
  rows.forEach(r => { r.bDownload.hidden = false; });
}

let last = performance.now();
function tick(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  rows.forEach(r => r.frame(dt));
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
})();
</script>
